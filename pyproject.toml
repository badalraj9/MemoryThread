[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-thread"
version = "1.0.0"
description = "A truth-preserving, multi-agent cognitive memory system for AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Badal Raj", email = "badalraj@example.com"}
]
keywords = [
    "memory", "ai", "cognitive", "truth-preservation", 
    "multi-agent", "llm", "rag", "knowledge-graph"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "sentence-transformers>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
db = [
    "psycopg2-binary>=2.9",
    "qdrant-client>=1.5",
]
streaming = [
    "pyzmq>=25.0",
    "aiokafka>=0.8",
]
tui = [
    "textual>=0.40",
]
nlp = [
    "spacy>=3.5",
]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41",
    "opentelemetry-exporter-otlp>=1.20",
]
full = [
    "memory-thread[api,db,streaming,tui,nlp,observability]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/badalraj/MemoryThread"
Documentation = "https://github.com/badalraj/MemoryThread#readme"
Repository = "https://github.com/badalraj/MemoryThread"
Issues = "https://github.com/badalraj/MemoryThread/issues"

[project.scripts]
mt = "memory_thread.cli:main"
mt-api = "memory_thread.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_thread*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
