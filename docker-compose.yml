version: '3.8'

services:
  mt-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MT_NAMESPACE=default
      - MT_DB_TYPE=postgres
      - MT_POSTGRES_HOST=postgres
      - MT_POSTGRES_PORT=5432
      - MT_POSTGRES_USER=memory
      - MT_POSTGRES_PASSWORD=memory123
      - MT_POSTGRES_DB=memorythread
      - MT_QDRANT_HOST=qdrant
    depends_on:
      - postgres
      - qdrant
    command: uvicorn memory_thread.api.server:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=memory
      - POSTGRES_PASSWORD=memory123
      - POSTGRES_DB=memorythread
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

volumes:
  postgres_data:
  qdrant_data: