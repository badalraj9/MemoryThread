services:
  mt-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MT_NAMESPACE=default
      - MT_DB_TYPE=postgres
      - MT_POSTGRES_HOST=postgres
      - MT_POSTGRES_PORT=5432
      - MT_POSTGRES_USER=memory
      - MT_POSTGRES_PASSWORD=memory123
      - MT_POSTGRES_DB=memorythread
      - MT_API_KEY=${MT_API_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=memory
      - POSTGRES_PASSWORD=memory123
      - POSTGRES_DB=memorythread
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memorythread"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
